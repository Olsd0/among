<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMONG 어몽 · 프랜차이즈 쿠폰 비교</title>
<meta name="description" content="햄버거·커피 프랜차이즈 자사앱 쿠폰을 쿠폰가·할인율·조건으로 한눈에 비교하고, 고른 혜택은 공식 앱에서 바로 확인하세요.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111015" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="AMONG 어몽 · 프랜차이즈 쿠폰 비교">
<meta property="og:description" content="자사앱 쿠폰, 앱 하나씩 열지 말고 한 번에 비교">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="config.js"></script>
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f6f6f9; --line: #ececf2; --line-strong: #dcdce6;
    --text: #17161c; --text-2: #4a4957; --muted: #8a8a99;
    --primary: #5b3df5; --primary-ink: #ffffff; --primary-soft: #efebff;
    --sale: #e5283b; --sale-soft: #fff0f1; --warn: #a35400; --warn-soft: #fff3df; --info: #2457c5; --info-soft: #eaf1ff;
    --shadow: 0 1px 2px rgba(23, 22, 28, .04), 0 4px 16px rgba(23, 22, 28, .05);
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111015; --surface: #1a1920; --surface-2: #22212a; --line: #2c2b35; --line-strong: #3a3944;
      --text: #f2f1f6; --text-2: #c9c8d3; --muted: #9c9baa;
      --primary: #8f7bff; --primary-ink: #111015; --primary-soft: #29243f;
      --sale: #ff6574; --sale-soft: #3a1d23; --warn: #ffb547; --warn-soft: #3a2a12; --info: #8db2ff; --info-soft: #1c2742;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111015; --surface: #1a1920; --surface-2: #22212a; --line: #2c2b35; --line-strong: #3a3944;
    --text: #f2f1f6; --text-2: #c9c8d3; --muted: #9c9baa;
    --primary: #8f7bff; --primary-ink: #111015; --primary-soft: #29243f;
    --sale: #ff6574; --sale-soft: #3a1d23; --warn: #ffb547; --warn-soft: #3a2a12; --info: #8db2ff; --info-soft: #1c2742;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  svg { flex: none; }
  .shell { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* 머리글 */
  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -.02em; text-decoration: none; }
  .logo img { width: 36px; height: 36px; border-radius: 10px; }
  .bar .sp { flex: 1; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .search { padding: 0 16px 10px; display: none; }
  .search.on { display: block; }
  .search input {
    width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2);
    padding: 0 14px; font: inherit; color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--primary); }

  /* 카테고리 */
  nav.cats { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav.cats::-webkit-scrollbar { display: none; }
  .cat { flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 9px; color: var(--muted); font-size: 13px; position: relative; }
  .cat[aria-selected="true"] { color: var(--primary); font-weight: 700; }
  .cat[aria-selected="true"]::after { content: ""; position: absolute; left: 16%; right: 16%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--primary); }

  /* 정렬 · 필터 */
  .tools { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; }
  .sorts { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .sorts::-webkit-scrollbar { display: none; }
  .chip-btn { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 14px; color: var(--text-2); white-space: nowrap; }
  .chip-btn[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .filter-btn { position: relative; width: 44px; height: 36px; border-radius: 999px; border: 1px solid var(--line-strong); display: grid; place-items: center; flex: none; }
  .filter-btn[data-on="true"] { border-color: var(--primary); color: var(--primary); }
  .filter-btn[data-on="true"]::after { content: ""; position: absolute; top: 6px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--sale); }
  .summary { padding: 6px 18px 2px; font-size: 13px; color: var(--muted); min-height: 24px; }

  /* 안내 띠 */
  .notice { margin: 8px 16px 0; padding: 10px 12px; border-radius: 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
  .notice.demo { background: var(--warn-soft); color: var(--warn); }
  .notice.sync { background: var(--info-soft); color: var(--info); }
  .notice.err { background: var(--sale-soft); color: var(--sale); }
  .notice[hidden] { display: none; }

  /* 카드 */
  main { flex: 1; padding: 8px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card-main { display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; padding: 16px 16px 10px; align-items: start; cursor: pointer; }
  .tile { width: 76px; height: 76px; border-radius: 14px; background: var(--surface-2); color: var(--text-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 6px; }
  .tile .logo { width: 32px; height: 32px; border-radius: 8px; background: #fff; object-fit: contain; padding: 3px; box-shadow: 0 0 0 1px var(--line, rgba(0,0,0,.08)); }
  .tile .logo + .cat-ico { display: none; }
  .tile span { font-size: 12px; font-weight: 700; line-height: 1.15; color: var(--text); overflow-wrap: anywhere; }
  .info { min-width: 0; }
  .menu { margin: 0 0 6px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
  .prow { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); }
  .prow + .prow { margin-top: 2px; }
  .prow .lbl { min-width: 38px; flex: none; white-space: nowrap; }
  .prow s { color: var(--muted); }
  .prow.cp .lbl { color: var(--primary); font-weight: 600; }
  .prow.cp b { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .prow.cp em { font-style: normal; font-size: 15px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
  .rate { min-width: 64px; padding: 8px 8px 7px; border-radius: 12px; background: var(--sale-soft); color: var(--sale); text-align: center; line-height: 1.1; }
  .rate b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .rate b small { font-size: 13px; font-weight: 700; }
  .prow b.sm { font-size: 14px; font-weight: 700; }
  .rate span { font-size: 12px; font-weight: 600; }
  .rate.none { background: var(--surface-2); color: var(--muted); }
  .rate.none b { font-size: 14px; padding: 6px 0 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
  .badge.b-aud { background: var(--warn-soft); color: var(--warn); }
  .badge.b-app { background: var(--primary-soft); color: var(--primary); }
  .card-foot { display: flex; align-items: center; gap: 6px; padding: 0 16px 14px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line-strong); font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .chip.due { border-color: color-mix(in srgb, var(--sale) 55%, transparent); color: var(--sale); }
  .chip.soon { border-color: var(--line-strong); color: var(--info); }
  .cta { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--primary); color: var(--primary-ink); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .cta:active { transform: translateY(1px); }
  .detail { border-top: 1px dashed var(--line-strong); margin: 0 16px; padding: 12px 0 14px; font-size: 13.5px; }
  .detail[hidden] { display: none; }
  .detail dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; }
  .detail .acts { display: flex; justify-content: flex-end; margin-top: 10px; }
  .link-btn { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px 2px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .skel { height: 150px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  footer.bottom { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 8px; }
  footer .when { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); }
  footer p { margin: 6px 0 0; }
  footer .fine { font-size: 11.5px; margin-top: 12px; line-height: 1.5; }

  /* 시트(필터·제보) */
  dialog { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgba(10, 10, 14, .45); }
  .sheet { padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .group { margin-bottom: 16px; }
  .group > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .switch input { width: 20px; height: 20px; accent-color: var(--primary); }
  .sheet .btns { display: flex; gap: 8px; margin-top: 6px; }
  .btn { flex: 1; height: 48px; border-radius: 12px; font-weight: 700; }
  .btn.primary { background: var(--primary); color: var(--primary-ink); }
  .btn.ghost { background: var(--surface-2); }
  .reasons label { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .reasons input { accent-color: var(--primary); width: 18px; height: 18px; }
  textarea { width: 100%; min-height: 72px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font: inherit; padding: 10px 12px; resize: vertical; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="bar">
      <a class="logo" href="./" aria-label="AMONG 처음으로"><img src="icon-192.png" alt="">AMONG</a>
      <span class="sp"></span>
      <button class="icon-btn" id="searchBtn" aria-label="메뉴 검색" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="지금 쿠폰 다시 확인">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
    </div>
    <div class="search" id="searchRow"><label class="sr" for="q">메뉴·브랜드 검색</label><input id="q" type="search" placeholder="메뉴나 브랜드 검색 (예: 불고기, 와퍼)" autocomplete="off"></div>
    <nav class="cats" id="cats" role="tablist" aria-label="카테고리"></nav>
  </header>

  <div class="notice demo" id="demoNote" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <span>예시 데이터로 보는 중이에요. 가상의 브랜드이며 실제 쿠폰이 아닙니다.</span>
  </div>
  <div class="notice sync" id="syncNote" hidden></div>
  <div class="notice err" id="errNote" hidden></div>

  <div class="tools" role="toolbar" aria-label="정렬과 필터">
    <div class="sorts">
    <button class="chip-btn" data-sort="price">가격 낮은 순 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button>
    <button class="chip-btn" data-sort="rate">할인율 높은 순 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button>
    <button class="chip-btn" data-sort="deadline">마감 임박 순</button>
    </div>
    <button class="filter-btn" id="filterBtn" aria-label="필터">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
  <div class="summary" id="summary" aria-live="polite"></div>

  <main id="list" aria-busy="true"></main>

  <footer class="bottom">
    <span class="when"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="lastChecked">확인 시각 불러오는 중</span></span>
    <p>실제 혜택은 공식 앱에서 최종 확인하세요</p>
    <p class="fine">AMONG은 각 브랜드와 제휴하지 않은 독립 서비스로, 브랜드가 공개한 공식 페이지의 행사 정보를 매일 00시에 자동으로 모아 같은 기준으로 정리합니다.
      개인정보는 수집하지 않으며, 서비스 개선을 위해 익명 이용 기록(방문·이동)만 남깁니다.
      <br><button class="link-btn" id="themeBtn">화면 테마 바꾸기</button></p>
  </footer>
</div>

<dialog id="filterSheet" aria-labelledby="fTitle">
  <form method="dialog" class="sheet" id="filterForm">
    <h2 id="fTitle">필터</h2>
    <div class="group"><span>구성</span><div class="seg" data-key="itemType">
      <button type="button" class="chip-btn" data-v="">전체</button><button type="button" class="chip-btn" data-v="세트">세트</button><button type="button" class="chip-btn" data-v="단품">단품</button>
    </div></div>
    <div class="group"><span>주문 방법</span><div class="seg" data-key="channel">
      <button type="button" class="chip-btn" data-v="">전체</button><button type="button" class="chip-btn" data-v="매장">매장</button><button type="button" class="chip-btn" data-v="픽업">픽업</button><button type="button" class="chip-btn" data-v="배달">배달</button><button type="button" class="chip-btn" data-v="드라이브스루">드라이브스루</button>
    </div></div>
    <label class="switch"><span>누구나 쓸 수 있는 쿠폰만<br><small style="color:var(--muted)">신규회원·멤버십·개인 발급 쿠폰 제외</small></span><input type="checkbox" id="everyoneOnly"></label>
    <div class="btns"><button type="button" class="btn ghost" id="filterReset">초기화</button><button class="btn primary" value="ok">적용</button></div>
  </form>
</dialog>

<dialog id="reportSheet" aria-labelledby="rTitle">
  <form method="dialog" class="sheet" id="reportForm">
    <h2 id="rTitle">정보가 달라요</h2>
    <p id="reportTarget" style="margin:-6px 0 10px;color:var(--muted);font-size:14px"></p>
    <div class="reasons">
      <label><input type="radio" name="reason" value="가격이 달라요" required> 가격이 달라요</label>
      <label><input type="radio" name="reason" value="이미 끝났어요"> 이미 끝났어요</label>
      <label><input type="radio" name="reason" value="조건이 달라요"> 조건이 달라요</label>
      <label><input type="radio" name="reason" value="공식 앱에 없어요"> 공식 앱에 없어요</label>
      <label><input type="radio" name="reason" value="기타"> 기타</label>
    </div>
    <label class="sr" for="memo">자세한 내용</label>
    <textarea id="memo" name="memo" maxlength="500" placeholder="자세히 알려주시면 더 빨리 고칠 수 있어요 (선택)"></textarea>
    <div class="btns"><button type="button" class="btn ghost" id="reportCancel">취소</button><button class="btn primary" value="send">보내기</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import { sortCoupons, matchesFilters, daysLeft, todayKST } from './engine.js';

// ---------- 설정 ----------
const CFG = window.AMONG_CONFIG || {};
const params = new URLSearchParams(location.search);
const API = CFG.apiUrl || '';
const DEMO = params.has('demo') || !API;
const POLL_MS = 15000;

const CATS = [
  { id: '햄버거', icon: '<path d="M4 11a8 6 0 0 1 16 0z"/><path d="M3.5 14.5h17"/><path d="M5 17.5h14a1 1 0 0 1-1 1.5H6a1 1 0 0 1-1-1.5z"/>' },
  { id: '카페', icon: '<path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5v2M12 3.5v2"/>' },
  { id: '치킨', icon: '<path d="M14.5 4.5a5 5 0 0 1 2.8 8.6c-1.6 1.6-3.8 1.9-5.5 1.2L8.5 17.6a1.8 1.8 0 1 1-2.1-2.1l3.3-3.3c-.7-1.7-.4-3.9 1.2-5.5a5 5 0 0 1 3.6-2.2z"/>' },

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 저장 불가 환경 */ } },
};
const sid = (() => {
  let s = store.get('among_sid', null);
  if (!s) { s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).replace(/-/g, '').slice(0, 20); store.set('among_sid', s); }
  return s;
})();

const state = {
  category: CATS.some((c) => c.id === prefs.category) ? prefs.category : '햄버거',
  sort: ['price', 'rate', 'deadline'].includes(prefs.sort) ? prefs.sort : 'price',
  filters: { itemType: '', channel: '', everyoneOnly: false, ...(prefs.filters || {}) },
  q: '',
  coupons: [],
  meta: {},
  loading: true,

};
const savePrefs = () => store.set('among_prefs', { category: state.category, sort: state.sort, filters: state.filters });

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => (n === null || n === undefined || n === '' || Number.isNaN(+n) ? '' : Number(n).toLocaleString('ko-KR'));
const safeUrl = (u) => (/^https?:\/\//i.test(String(u || '')) ? String(u).split(' ')[0] : '');
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
// 브랜드 아이콘: 공식 사이트 주소의 사이트 아이콘(파비콘)을 그대로 불러와 표시만 한다 (저장·가공 안 함). 실패하면 카테고리 아이콘
const siteDomain = (u) => { const h = host(u).split('.'); return h.slice(/\.(co|or|go|ne)\.kr$/.test(host(u)) ? -3 : -2).join('.'); };
const logoUrl = (c) => { const d = siteDomain(safeUrl(c.source_url) || safeUrl(c.official_link)); return d ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64` : ''; };
const md = (iso) => (iso ? `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}` : '');

function fmtChecked(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const k = new Date(d.getTime() + 9 * 3600e3);
  const hm = `${String(k.getUTCHours()).padStart(2, '0')}:${String(k.getUTCMinutes()).padStart(2, '0')}`;
  const day = k.toISOString().slice(0, 10);
  return day === todayKST() ? hm : `${md(day)} ${hm}`;
}

// ---------- 서버 통신 ----------
async function api(action) {
  const u = new URL(API); u.searchParams.set('action', action);
  const res = await fetch(u, { redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '응답 오류');
  return j;
}
async function apiPost(body) {
  const res = await fetch(API, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
  return res.json();
}
function track(type, extra = {}) {
  if (DEMO) return;
  const body = JSON.stringify({ action: 'event', sid, type, ...extra });
  try {
    if (navigator.sendBeacon && navigator.sendBeacon(API, new Blob([body], { type: 'text/plain;charset=utf-8' }))) return;
  } catch { /* 다음 방법으로 */ }
  fetch(API, { method: 'POST', body, keepalive: true, mode: 'no-cors', headers: { 'content-type': 'text/plain;charset=utf-8' } }).catch(() => {});
}

async function loadCoupons({ quiet = false } = {}) {
  if (DEMO) { applyData(demoData()); return; }
  const cached = store.get('among_cache', null);
  if (cached && !state.coupons.length) applyData(cached);
  try {
    const data = await api('coupons');
    store.set('among_cache', { coupons: data.coupons, last_checked_at: data.last_checked_at });
    applyData(data);
    $('#errNote').hidden = true;
  } catch (e) {
    if (!quiet) {
      $('#errNote').hidden = false;
      $('#errNote').textContent = cached ? '연결이 불안정해 마지막으로 받은 쿠폰을 보여드려요.' : '쿠폰을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    }
    state.loading = false; render();
  }
}
function applyData(data) {
  state.coupons = (data.coupons || []).filter((c) => !c.end_date || c.end_date >= todayKST());
  state.meta = { last_checked_at: data.last_checked_at };
  state.loading = false;
  render();
}

// ---------- 화면 ----------
function renderCats() {
  $('#cats').innerHTML = CATS.map((c) => `

}

function dueChip(c, today) {
  if (c.start_date && c.start_date > today) return `<span class="chip soon">${ICON.cal}${md(c.start_date)} 시작</span>`;
  const d = daysLeft(c.end_date, today);
  if (d === null) return `<span class="chip">${ICON.cal}기간 확인 필요</span>`;
  return `<span class="chip due">${ICON.cal}${d === 0 ? '오늘 종료' : `D-${d}`}</span>`;
}

function rateBox(c) {
  if (c.discount_type === 'free_item') return `<div class="rate"><b>${c.discount_rate ? c.discount_rate + '%' : '증정'}</b><span>${c.discount_rate ? '체감 할인' : '1+1·증정'}</span></div>`;
  if (c.discount_type === 'amount' && (c.coupon_price === null || c.coupon_price === '') && c.discount_value) return `<div class="rate"><b>${Math.round(c.discount_value / 1000) >= 1 ? Math.round(c.discount_value / 1000) + '천' : c.discount_value}<small>원</small></b><span>할인</span></div>`;
  if (c.discount_rate === null || c.discount_rate === undefined || c.discount_rate === '') return '<div class="rate none"><b>특가</b><span>정상가 미표기</span></div>';
  return `<div class="rate"><b>${c.discount_rate}%</b><span>할인</span></div>`;
}

// 쿠폰가가 있으면 쿠폰가, 없으면 주문 전체 할인 (정률·정액)
function priceRow(c) {
  if (c.coupon_price !== null && c.coupon_price !== undefined && c.coupon_price !== '') {
    return `<div class="prow cp"><span class="lbl">쿠폰가</span><b>${won(c.coupon_price)}<em>원</em></b></div>`;
  }
  if (c.discount_type === 'percent' && c.discount_rate) return `<div class="prow cp"><span class="lbl">주문 할인</span><b>${c.discount_rate}<em>%</em></b></div>`;
  if (c.discount_type === 'amount' && c.discount_value) return `<div class="prow cp"><span class="lbl">주문 할인</span><b>${won(c.discount_value)}<em>원</em></b></div>`;
  if (c.discount_type === 'free_item') return '<div class="prow cp"><span class="lbl">혜택</span><b class="sm">1+1 · 증정</b></div>';
  return '<div class="prow cp"><span class="lbl">혜택</span><b class="sm">공식 앱에서 확인</b></div>';
}

const AUD = { 신규회원: '신규회원 전용', 멤버십: '멤버십 전용', 개인: '받은 사람만 (개인 쿠폰)' };

        <svg class="cat-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${(CATS.find((x) => x.id === c.category) || CATS[0]).icon}</svg>

        ${c.regular_price ? `<div class="prow"><span class="lbl">정상가</span><s>${won(c.regular_price)}원</s></div>` : ''}
        ${priceRow(c)}

    </div>
    <div class="detail" id="dt-${esc(c.id)}" ${open ? '' : 'hidden'}>
      <dl>
        <dt>기간</dt><dd>${c.start_date ? md(c.start_date) : ''} ~ ${c.end_date ? md(c.end_date) : '미정'}${c.end_date ? ` (${daysLeft(c.end_date, today) === 0 ? '오늘까지' : daysLeft(c.end_date, today) + '일 남음'})` : ''}</dd>
        <dt>주문</dt><dd>${esc(ch)}</dd>
        <dt>대상</dt><dd>${esc(c.audience === '전체' ? '앱 회원 누구나' : AUD[c.audience] || c.audience)}${c.app_only ? ' · 공식 앱에서만' : ''}</dd>
        ${cond ? `<dt>조건</dt><dd>${esc(cond)}</dd>` : ''}
        ${src ? `<dt>출처</dt><dd><a href="${esc(src)}" target="_blank" rel="noopener">${esc(host(src))} 공식 페이지</a></dd>` : ''}
        <dt>확인</dt><dd>${esc(fmtChecked(c.checked_at) || '-')} 자동 확인</dd>
      </dl>
      <div class="acts"><button class="link-btn" data-report="${esc(c.id)}">정보가 달라요</button></div>
    </div>

}

function render() {
  const today = todayKST();
  renderCats();
  document.querySelectorAll('[data-sort]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort)));
  const f = state.filters;
  $('#filterBtn').dataset.on = String(!!(f.itemType || f.channel || f.everyoneOnly));

  const list = $('#list');
  list.setAttribute('aria-busy', String(state.loading));
  if (state.loading && !state.coupons.length) {
    list.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    $('#summary').textContent = '';
    return;
  }
  const shown = sortCoupons(state.coupons.filter((c) => matchesFilters(c, { category: state.category, ...f, q: state.q })), state.sort, today);
  const brands = new Set(shown.map((c) => c.brand)).size;
  $('#summary').textContent = shown.length ? `${state.category === '전체' ? '전체' : state.category} 쿠폰 ${shown.length}개 · 브랜드 ${brands}곳` : '';

  if (!shown.length) {
    const inCat = state.coupons.some((c) => state.category === '전체' || c.category === state.category);
    list.innerHTML = inCat
      ? '<div class="empty"><b>조건에 맞는 쿠폰이 없어요</b>필터나 검색어를 바꿔 보세요.</div>'
      : `<div class="empty"><b>${esc(state.category)} 쿠폰은 준비 중이에요</b>햄버거부터 시작해 차례로 늘려가고 있어요.</div>`;
  } else {
    list.innerHTML = shown.map((c) => card(c, today)).join('');
  }
  $('#lastChecked').textContent = state.meta.last_checked_at ? `마지막 확인 ${fmtChecked(state.meta.last_checked_at)}` : '확인 시각 없음';
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
}

// ---------- 즉시 갱신 (매일 00시 자동 + 버튼) ----------
function setSync(on, text) {
  state.syncing = on;
  $('#refreshBtn').classList.toggle('spin', on);
  $('#syncNote').hidden = !on;
  if (text) $('#syncNote').textContent = text;
}

async function pollUntilDone(sinceIso) {
  const before = new Set(state.coupons.map((c) => c.id));
  const started = Date.now();
  while (Date.now() - started < 30 * 60e3) {
    await new Promise((r) => setTimeout(r, POLL_MS));
    let st;
    try { st = await api('status'); } catch { continue; }
    if (st.state === 'running') setSync(true, '공식 페이지를 확인하고 있어요… 보통 3~5분 걸려요.');
    if (st.state === 'idle' && (!sinceIso || (st.last_finished_at && st.last_finished_at > sinceIso))) {
      await loadCoupons({ quiet: true });
      setSync(false);
      const added = state.coupons.filter((c) => !before.has(c.id)).length;
      toast(st.last_state === 'failed' ? '일부 출처를 확인하지 못했어요. 나중에 다시 시도해 주세요.' : added ? `갱신 완료 · 새 쿠폰 ${added}개` : '갱신 완료 · 바뀐 쿠폰이 없어요');
      return;
    }
  }
  setSync(false);
}

async function refresh() {
  if (state.syncing) { toast('이미 확인하고 있어요. 조금만 기다려 주세요.'); return; }
  if (DEMO) { toast('예시 모드에서는 실제 갱신이 일어나지 않아요.'); return; }
  setSync(true, '최신 쿠폰 확인을 요청했어요…');
  const reqAt = new Date().toISOString();
  try {
    const r = await apiPost({ action: 'refresh' });
    if (!r.ok) throw new Error(r.error);
    if (r.accepted) { setSync(true, '최신 쿠폰을 확인하고 있어요. 보통 3~5분 걸려요.'); pollUntilDone(reqAt); return; }
    if (r.reason === 'cooldown') { setSync(false); toast(`방금 확인했어요. ${Math.ceil(r.retry_after_s / 60)}분 뒤에 다시 할 수 있어요.`); return; }
    setSync(true, '이미 확인하고 있어요. 끝나면 자동으로 바뀌어요.'); pollUntilDone(null);
  } catch (e) {
    setSync(false); toast('지금은 갱신할 수 없어요. 잠시 후 다시 시도해 주세요.');
  }
}

async function checkStatusOnLoad() {
  if (DEMO) return;
  try {
    const st = await api('status');
    if (st.last_checked_at && !state.meta.last_checked_at) { state.meta.last_checked_at = st.last_checked_at; render(); }
    if (st.state !== 'idle') { setSync(true, '최신 쿠폰을 확인하고 있어요. 끝나면 자동으로 바뀌어요.'); pollUntilDone(null); }
  } catch { /* 상태 확인 실패는 무시 */ }
}

// ---------- 이벤트 ----------
$('#cats').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  state.category = b.dataset.cat; savePrefs(); render();
});
document.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => { state.sort = b.dataset.sort; savePrefs(); render(); }));

$('#list').addEventListener('click', (e) => {
  const cta = e.target.closest('[data-click]');
  if (cta) { const c = state.coupons.find((x) => x.id === cta.dataset.click); track('click', { coupon_id: c?.id, brand: c?.brand }); return; }
  const rep = e.target.closest('[data-report]');
  if (rep) { openReport(rep.dataset.report); return; }
  const main = e.target.closest('.card-main');
  if (main) toggleCard(main);
});
$('#list').addEventListener('keydown', (e) => {
  const main = e.target.closest('.card-main');
  if (main && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleCard(main); }
});
function toggleCard(main) {
  const id = main.closest('.card').dataset.id;
  const dt = document.getElementById('dt-' + id);
  const open = dt.hidden;
  dt.hidden = !open;
  main.setAttribute('aria-expanded', String(open));
  if (open) { state.open.add(id); const c = state.coupons.find((x) => x.id === id); track('detail', { coupon_id: id, brand: c?.brand }); }
  else state.open.delete(id);
}

$('#searchBtn').addEventListener('click', () => {
  const row = $('#searchRow'); const on = !row.classList.contains('on');
  row.classList.toggle('on', on); $('#searchBtn').setAttribute('aria-expanded', String(on));
  if (on) $('#q').focus(); else { $('#q').value = ''; state.q = ''; render(); }
});
$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); render(); });
$('#refreshBtn').addEventListener('click', refresh);

// 필터 시트
const fSheet = $('#filterSheet');
let draft = null;
function paintFilter() {
  fSheet.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === draft[seg.dataset.key]))));
  $('#everyoneOnly').checked = !!draft.everyoneOnly;
}
$('#filterBtn').addEventListener('click', () => { draft = { ...state.filters }; paintFilter(); fSheet.showModal(); });
fSheet.addEventListener('click', (e) => {
  const b = e.target.closest('[data-v]');
  if (b) { draft[b.closest('.seg').dataset.key] = b.dataset.v; paintFilter(); }
  if (e.target === fSheet) fSheet.close('cancel');
});
$('#everyoneOnly').addEventListener('change', (e) => { draft.everyoneOnly = e.target.checked; });
$('#filterReset').addEventListener('click', () => { draft = { itemType: '', channel: '', everyoneOnly: false }; paintFilter(); });
fSheet.addEventListener('close', () => {
  if (fSheet.returnValue === 'ok' && draft) { state.filters = draft; savePrefs(); render(); track('filter', { value: JSON.stringify(draft) }); }
});

// 제보 시트
const rSheet = $('#reportSheet');
let reportId = null;
function openReport(id) {
  const c = state.coupons.find((x) => x.id === id); if (!c) return;
  reportId = id;
  $('#reportForm').reset();
  $('#reportTarget').textContent = `${c.brand} · ${c.menu}${c.coupon_price ? ` · ${won(c.coupon_price)}원` : ''}`;
  rSheet.showModal();
}
$('#reportCancel').addEventListener('click', () => rSheet.close('cancel'));
rSheet.addEventListener('click', (e) => { if (e.target === rSheet) rSheet.close('cancel'); });
rSheet.addEventListener('close', async () => {
  if (rSheet.returnValue !== 'send' || !reportId) return;
  const c = state.coupons.find((x) => x.id === reportId);
  const fd = new FormData($('#reportForm'));
  if (DEMO) { toast('예시 모드라 제보가 전송되지 않았어요.'); return; }
  try {
    await apiPost({ action: 'report', sid, coupon_id: reportId, brand: c?.brand, menu: c?.menu, reason: fd.get('reason'), memo: fd.get('memo') });
    toast('알려주셔서 고마워요. 확인 후 고칠게요.');
  } catch { toast('제보를 보내지 못했어요. 잠시 후 다시 시도해 주세요.'); }
});

// 테마 (시스템 → 라이트 → 다크)
const THEMES = ['system', 'light', 'dark'];
function applyTheme(t) { if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; }
let theme = store.get('among_theme', 'system'); applyTheme(theme);
$('#themeBtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); store.set('among_theme', theme);
  toast({ system: '기기 설정을 따라요', light: '밝은 화면', dark: '어두운 화면' }[theme]);
});

// ---------- 시작 ----------
$('#demoNote').hidden = !DEMO;
render();
loadCoupons().then(checkStatusOnLoad);
track('visit', { value: document.referrer ? host(document.referrer) : '' });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
