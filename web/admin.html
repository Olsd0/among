<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'none'; font-src 'self'; frame-src 'none'; img-src 'self' data: https://*.coupangcdn.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>AMONG 관리 · 앱 전용 쿠폰 · 온라인 특가 · 지표</title>
<link rel="stylesheet" href="fonts.css?v=20261107-3">
<link rel="stylesheet" href="brand.css?v=20261107-4">
<link rel="stylesheet" href="app-coupons.css?v=20261107-3">
<link rel="stylesheet" href="app-coupon-admin.css?v=20261107-4">
<link rel="stylesheet" href="online-admin.css?v=20261107-4">
<link rel="icon" href="icon-64.png?v=20261107-3" type="image/png">
<script src="config.js"></script>
<link rel="stylesheet" href="admin.css?v=20261107-4">
</head>
<body>
<div class="wrap" hidden>
  <header>
    <h1><span class="brand-lockup"><img class="brand-symbol" src="among-symbol.svg?v=20261107-4" alt="" width="36" height="34"><img class="wordmark" src="among-logo.svg?v=20261107-4" alt="AMONG" width="100" height="28"></span> 관리</h1>
    <form class="ctrl" id="authForm">
      <label class="muted" for="token">관리 토큰</label>
      <input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" size="18">
      <select id="days" aria-label="기간"><option value="7">최근 7일</option><option value="14">최근 14일</option><option value="30" selected>최근 30일</option><option value="60">최근 60일</option></select>
      <button class="primary">불러오기</button>
      <button type="button" id="copyBtn">보고서용 요약 복사</button>
    </form>
  </header>
  <div class="note demo" id="demoNote" hidden>예시 지표입니다. 실제 수치가 아니므로 보고서에 쓰지 마세요. (config.js에 Apps Script URL을 넣으면 실제 지표를 불러옵니다)</div>
  <div class="note err" id="errNote" hidden></div>
  <section id="appCouponManager" aria-label="앱 전용 쿠폰 관리"></section>
  <section id="onlineDealsManager" aria-label="온라인 특가 관리"></section>

  <section class="tiles" id="tiles" aria-label="핵심 지표"></section>

  <section class="grid2">
    <div class="card"><h2>일별 방문자</h2><div class="chart" id="chVisitors"></div></div>
    <div class="card"><h2>일별 공식 앱 이동</h2><div class="chart" id="chClicks"></div></div>
  </section>

  <section class="card">
    <h2>최근 자동 수집</h2>
    <div class="scroll"><table id="runs"></table></div>
  </section>

  <section class="grid2 metrics-breakdown">
    <div class="card"><h2>출처 상태</h2><div class="scroll"><table id="sources"></table></div></div>
    <div class="card">
      <h2>브랜드별 게시 쿠폰</h2><div class="bars" id="brands"></div>
      <h2 class="pending-title">보류 사유</h2><div class="bars" id="pending"></div>
    </div>
  </section>

  <section class="card">
    <h2>최근 제보</h2>
    <div class="scroll"><table id="reports"></table></div>
  </section>
</div>

<script type="module" src="admin.js?v=20261107-1"></script>
<script type="module" src="app-coupon-admin.js?v=20261107-1"></script>
<script type="module" src="online-admin.js?v=20261113-1"></script>
</body>
</html>
