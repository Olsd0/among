name: online-item-rotate

# 항목별 인기순 교체 (11/11 대표 요청): 매일 아침 작업이 쿠팡 파트너스 '상품 링크' 검색(쿠팡랭킹순)에서 항목마다 위에서부터 고른 상품으로
# 항목 카드를 바꾼다. 순위가 어제와 같으면 카드는 그대로 두고 가격만 기록한다. 순위에서 빠진 카드는 노출만 끝낸다(지우지 않음).
# 시트에는 수집기 토큰(GitHub Secrets)으로만 쓴다. 관리 토큰은 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      items:
        description: '{"protein":[{"title":"…","price":23750,"html":"<a href=…><img …></a>"}, …], …}'
        required: true
        type: string
      watch:
        description: '(선택) 가격만 기록할 후보 {"protein":[{"title":"…","price":23750}, …]} — 검색 결과 위쪽 24개쯤'
        required: false
        type: string
      deals:
        description: '(선택) 오늘의 특가(골드박스 먹거리) [{"title":"…","price":13180,"html":"<a href=…><img …></a>"}]'
        required: false
        type: string
      mode:
        description: 'run = 시트에 반영 / dry = 입력 확인만'
        required: false
        default: run
        type: choice
        options: [run, dry]

concurrency:
  group: online-item-rotate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  online-item-rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 인기순 교체 · 시트 반영
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          ITEMS_JSON: ${{ inputs.items }}
          WATCH_JSON: ${{ inputs.watch }}
          DEALS_JSON: ${{ inputs.deals }}
          ROTATE_MODE: ${{ inputs.mode || 'run' }}
        run: node src/online/rotate.js
