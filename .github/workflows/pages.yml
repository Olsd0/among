name: pages

# 11/08부터 AMONG 대표 주소는 https://www.amongpick.com/ (Cloudflare Pages, docs/launch-readiness.md).
# 옛 주소 https://olsd0.github.io/among/ 에는 새 주소로 보내는 이동 안내만 배포한다
# (같은 경로·검색어·#로 이동, 옛 서비스 워커·캐시 정리, 새 도메인 밖으로는 보내지 않음).
on:
  push:
    branches: [main]
    paths: ['collector/scripts/build-moved-site.js', 'collector/scripts/prepare-pages.js', '.github/workflows/pages.yml']
  workflow_dispatch:

# 보안: 배포에 필요한 권한만 (저장소 쓰기 없음). 외부 액션은 커밋 해시로 고정
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    # 비공개 저장소에서는 무료 플랜 Pages를 쓸 수 없어 건너뛴다 (공개로 바꾸면 자동으로 동작)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 이동 안내 검사
        run: node --test collector/test/domain-move.test.js
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: 옛 주소 → www.amongpick.com 이동 안내 만들기
        run: node collector/scripts/build-moved-site.js https://www.amongpick.com/ moved
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: moved
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
