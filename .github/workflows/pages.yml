name: pages

# web/ 폴더를 GitHub Pages로 배포 (main에 web/ 또는 엔진이 바뀌면)
on:
  push:
    branches: [main]
    paths: ['web/**', 'collector/src/engine.js', 'collector/src/app-coupons.js', 'collector/src/product-images.js', 'collector/src/notice-images.js', 'collector/src/verified-news.js', 'collector/scripts/prepare-pages.js', '.github/workflows/pages.yml']
  workflow_dispatch:

# 보안: 배포에 필요한 권한만 (저장소 쓰기 없음). 외부 액션은 커밋 해시로 고정
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 비공개 저장소에서는 무료 플랜 Pages를 쓸 수 없어 건너뛴다 (공개로 바꾸면 자동으로 동작)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 엔진 사본 확인
        run: cmp collector/src/engine.js web/engine.js || (echo "web/engine.js가 오래됐습니다. collector에서 npm run sync-web 실행 후 커밋하세요." && exit 1)
      - name: 상품 사진 목록 사본 확인
        run: cmp collector/src/product-images.js web/product-images.js
      - name: 공지 이미지 목록 사본 확인
        run: cmp collector/src/notice-images.js web/notice-images.js
      - name: 수동 확인 공지 사본 확인
        run: cmp collector/src/verified-news.js web/verified-news.js
      - name: 앱 쿠폰 규칙 사본 확인
        run: cmp collector/src/app-coupons.js web/app-coupons.js
      # 저장소 변수가 있으면 그 값으로 바꾸고(없으면 저장소의 값 유지), JSON으로 안전하게 써 넣는다.
      # API 주소는 화면 보안 정책(CSP)이 허용한 script.google.com만, 문의 메일은 메일 형식만 받는다.
      - name: 화면 설정 주입 (APPS_SCRIPT_URL · CONTACT_EMAIL)
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          node -e '
            const fs = require("fs"), vm = require("vm");
            const box = { window: {} };
            vm.runInNewContext(fs.readFileSync("web/config.js", "utf8"), box);
            const cfg = { apiUrl: "", contactEmail: "", ...box.window.AMONG_CONFIG };
            if (process.env.APPS_SCRIPT_URL) cfg.apiUrl = process.env.APPS_SCRIPT_URL.trim();
            if (process.env.CONTACT_EMAIL) cfg.contactEmail = process.env.CONTACT_EMAIL.trim();
            if (cfg.apiUrl && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(cfg.apiUrl)) { console.error("APPS_SCRIPT_URL 형식이 아님"); process.exit(1); }
            if (cfg.contactEmail && !/^[^\s@<>\x22\x27]+@[^\s@<>\x22\x27]+\.[A-Za-z]{2,}$/.test(cfg.contactEmail)) { console.error("CONTACT_EMAIL 형식이 아님"); process.exit(1); }
            fs.writeFileSync("web/config.js", "window.AMONG_CONFIG = " + JSON.stringify(cfg) + ";\n");
            console.log("설정: API " + (cfg.apiUrl ? "있음" : "없음(예시 모드)") + " · 문의 메일 " + (cfg.contactEmail ? "있음" : "없음"));
          '
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 검색 주소 생성 (Pages 실제 도메인 기준)
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node collector/scripts/prepare-pages.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
