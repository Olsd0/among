name: tests

# 화면만 고친 경우에도 배포 전에 엔진·백엔드·브라우저 종단 테스트를 확인한다.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          AMONG_QA_SCREENSHOT: /tmp/among-app-coupons-mobile.png
      - name: 앱 쿠폰 모바일 검증 화면
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-coupons-mobile-qa
          path: /tmp/among-app-coupons-mobile*.png
          if-no-files-found: ignore
          retention-days: 7
