name: tests

# 화면만 고친 경우에도 배포 전에 엔진·백엔드·브라우저 종단 테스트를 확인한다.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          AMONG_QA_SCREENSHOT: /tmp/among-app-coupons-mobile.png
      - name: 앱 쿠폰 모바일 검증 화면
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-coupons-mobile-qa
          path: /tmp/among-app-coupons-mobile*.png
          if-no-files-found: ignore
          retention-days: 7
