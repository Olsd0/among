name: collect

# 매일 00:00 KST(= 15:00 UTC) 자동 수집 + 수동/버튼 실행
# GitHub 예약 실행은 부하에 따라 수 분~수십 분 늦어질 수 있다.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: '실행 주체 (manual | button)'
        required: false
        default: manual
      only:
        description: '특정 출처 id만 (쉼표 구분, 비우면 전체)'
        required: false
        default: ''
      mode:
        description: 'collect = 수집 / dry = AI 추출 시험(시트에 안 씀) / check = 출처 점검 / probe = 브랜드 탐색 / e2e = 전체 경로 점검 / nutrition = 영양성분만 갱신 / site = 공개 화면 점검 (check·probe·e2e·nutrition·site는 AI 호출 없음)'
        required: false
        default: collect
        type: choice
        options: [collect, dry, check, probe, e2e, nutrition, site]

# 동시에 두 번 돌지 않게 (버튼 연타·예약 실행 겹침)
concurrency:
  group: collect
  cancel-in-progress: false

# 보안: 이 워크플로의 GITHUB_TOKEN은 읽기만 (저장소에 쓰거나 배포할 수 없음). 비밀값은 필요한 단계에만 넘긴다.
# 외부 액션은 태그 대신 커밋 해시로 고정 (Dependabot이 새 버전을 알려 줌)
permissions:
  contents: read

# 실제 시트 반영 승인 스위치: AI 추출 정확도를 확인하기 전까지 00시 예약 실행은 시트에 쓰지 않는다(dry).
# 수동 실행(mode=collect)은 항상 반영. 확인이 끝나면 'true'로 바꿔 커밋.
env:
  PUBLISH_APPROVED: 'true'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 의존성 설치 (잠금 파일의 버전·무결성 해시 그대로)
        run: npm ci --no-fund

      - name: 브라우저 · 한글 글꼴 설치
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 테스트
        run: npm test

      - name: 출처 점검 (Claude 호출 없음)
        if: inputs.mode == 'check'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL }}
          ONLY: ${{ inputs.only }}
        run: node src/check-sources.js

      - name: 브랜드 탐색 (Claude 호출 없음)
        if: inputs.mode == 'probe'
        env:
          BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL }}
          ONLY: ${{ inputs.only }}
        run: node src/probe.js

      - name: 전체 경로 점검 (Claude 호출 없음 · 점검용 가짜 행사 → 실제 시트 반영 → 공개 API 확인 → 자동 내림)
        if: inputs.mode == 'e2e'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          MOCK_CLAUDE: '1'
          LOCAL_SOURCES: '1'
          SOURCES_FILE: test/e2e/sources.json
          TRIGGER: e2e
        run: |
          mkdir -p out/site && cp test/e2e/promo-on.html out/site/promo.html
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory out/site >/dev/null 2>&1 &
          sleep 2
          node src/e2e-verify.js base
          node src/run.js
          node src/e2e-verify.js expect-on
          cp test/e2e/promo-off.html out/site/promo.html
          node src/run.js
          node src/e2e-verify.js expect-off

      - name: 공개 화면 점검 (AI 호출 없음 · 휴대폰 크기 · 사진 불러오기 · 소식 상세)
        if: inputs.mode == 'site'
        env:
          SITE_URL: https://olsd0.github.io/among/
        run: node src/site-check.js

      - name: 수집
        if: inputs.mode != 'check' && inputs.mode != 'probe' && inputs.mode != 'e2e' && inputs.mode != 'nutrition' && inputs.mode != 'site'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ (inputs.mode == 'dry' || (github.event_name == 'schedule' && env.PUBLISH_APPROVED != 'true')) && '1' || '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice title=수집 건너뜀::AI 키(ANTHROPIC_API_KEY 또는 GEMINI_API_KEY)가 아직 등록되지 않아 수집을 건너뜁니다. 키를 등록하면 다음 실행부터 자동으로 수집합니다."
            exit 0
          fi
          node src/run.js

      # 영양성분: 식약처 공공데이터 (AI 호출 없음). 예약 실행 때는 주 1회만 실제로 갱신(최근 6일 안이면 스스로 건너뜀),
      # mode=nutrition 수동 실행은 항상 갱신. 실패해도 쿠폰 수집 결과에는 영향 없음
      - name: 영양성분 갱신 (주 1회 · 공공데이터)
        if: always() && (inputs.mode == 'nutrition' || github.event_name == 'schedule' || inputs.trigger == 'schedule')
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          NUTRITION_FIELD_MAP: ${{ vars.NUTRITION_FIELD_MAP }}
          FORCE: ${{ inputs.mode == 'nutrition' && '1' || '' }}
        run: node src/nutrition.js

      # 공개 저장소의 실행 결과는 로그인한 누구나 받을 수 있으므로 화면 사진(브랜드 이미지)은 남기지 않고, 추출 결과만 3일
      - name: 실행 결과 보관 (추출 결과 JSON, 3일)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-${{ github.run_id }}
          path: |
            collector/out/*.json
          if-no-files-found: ignore
          retention-days: 3
